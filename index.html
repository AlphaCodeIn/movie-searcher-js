<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0" />
        <title>Movie Search App</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-6">

        <header class="mb-8">
            <h1 class="text-4xl font-bold text-blue-400">🎬 Movie Search</h1>
            <p class="text-gray-400 mt-2 text-center">Find your favorite movies by name</p>
            <p class="text-red-400 mt-2 text-center">Note! Only 1000 Search Limit</p>
        </header>
    
        <div class="w-full max-w-xl flex gap-2 mb-10">
            <input type="text"
                   id="searchInput"
                   placeholder="Enter movie name..."
                   class="flex-grow p-3 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <button id="searchBtn"
                    class="search bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold transition">
                Search
            </button>
        </div>
    
        <div id="movieResult"
             class="w-full max-w-2xl mx-auto">
            
        </div>
    
        <!-- Footer with LinkedIn and GitHub Links -->
        <footer class="w-full text-center mt-8">
            <p class="text-gray-400">Connect with me:</p>
            <a href="https://www.linkedin.com/in/lucky-chauhan-12b18a25a/" target="_blank" class="text-blue-500 hover:text-blue-400">LinkedIn</a> | 
            <a href="https://github.com/AlphaCodeIn/" target="_blank" class="text-blue-500 hover:text-blue-400">GitHub</a>
        </footer>
    
        <script src="script.js"></script>
    </body>
    

</html>
